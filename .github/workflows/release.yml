name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  metadata:
    name: Match tag, Cargo version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/release-notes.py "$RELEASE_TAG" > release-notes.md

  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  build:
    name: Package ${{ matrix.target }}
    needs: [metadata, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: emd
          - os: macos-26
            target: aarch64-apple-darwin
            executable: emd
          - os: macos-26-intel
            target: x86_64-apple-darwin
            executable: emd
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: emd.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Build native CLI and run library tests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          cargo +stable test --locked --workspace --lib --target "$TARGET"
          cargo +stable build --locked --release -p emd-cli --target "$TARGET"
      - name: Smoke-check and archive the CLI, examples and manual
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          binary="target/$TARGET/release/$EXECUTABLE"
          test "$("$binary" --version)" = "emd ${GITHUB_REF_NAME#v}"
          "$binary" run examples/hello.emd
          "$binary" run compiler/asm.emd < examples/hello.asm > hello.check
          cmp hello.check examples/hello.emd
          package="emd-$GITHUB_REF_NAME-$TARGET"
          mkdir -p "$package/docs" "$package/editors/nvim" release-packages
          cp "$binary" LICENSE CHANGELOG.md "$package/"
          cp docs/install.md "$package/README.md"
          cp -R examples compiler "$package/"
          cp docs/{studio,language-spec,isa,assembly,semantics,tools,verification}.md "$package/docs/"
          cp editors/nvim/{README.md,studio.sh} "$package/editors/nvim/"
          cp -R editors/nvim/{lua,plugin,ftdetect,ftplugin} "$package/editors/nvim/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m zipfile -c "release-packages/$package.zip" "$package"
          else
            tar -czf "release-packages/$package.tar.gz" "$package"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emd-${{ matrix.target }}
          path: release-packages/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish packages with changelog notes
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emd-*
          merge-multiple: true
          path: release-packages
      - name: Generate checksums and publish exact changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python .github/release-notes.py "$RELEASE_TAG" > release-notes.md
          (cd release-packages && sha256sum emd-*.tar.gz emd-*.zip > SHA256SUMS)
          options=(--verify-tag --title "emd $RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-packages/* "${options[@]}"
